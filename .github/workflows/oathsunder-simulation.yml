name: Oathsunder simulation

on:
  push:
    paths:
      - "games/Oathsunder/**"
      - ".github/workflows/oathsunder-simulation.yml"
  pull_request:
    paths:
      - "games/Oathsunder/**"
      - ".github/workflows/oathsunder-simulation.yml"

permissions:
  contents: read

jobs:
  simulation:
    name: Deterministic core — build, test, benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/Oathsunder/Tools/DotNet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (warnings are errors)
        run: dotnet build Oathsunder.sln -c Release -nologo

      - name: Test (EditMode sources under NUnit)
        run: dotnet test Oathsunder.Simulation.Tests/Oathsunder.Simulation.Tests.csproj -c Release --no-build -nologo --logger "trx;LogFileName=results.trx"

      - name: Generated production specs are up to date (frame data, animation library, cue catalog, animspec JSON)
        run: dotnet run -c Release --no-build --project Oathsunder.Tools.FrameData -- --check

      - name: Frame data report
        run: dotnet run -c Release --no-build --project Oathsunder.Tools.FrameData -- frame-data.md

      - name: Benchmarks
        run: dotnet run -c Release --no-build --project Oathsunder.Tools.Benchmarks | tee benchmarks.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oathsunder-simulation-reports
          path: |
            games/Oathsunder/Tools/DotNet/**/TestResults/*.trx
            games/Oathsunder/Tools/DotNet/frame-data.md
            games/Oathsunder/Tools/DotNet/benchmarks.md
